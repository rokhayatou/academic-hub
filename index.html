<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Academic Hub</title>
<style>
  :root {
    --bg: #f5f6fa; --card: #ffffff; --text: #1b2236; --muted: #6b7280;
    --border: #e4e7ee; --accent: #9d2235;
    --green: #15803d; --green-bg: #dcfce7;
    --amber: #b45309; --amber-bg: #fef3c7;
    --gray: #6b7280; --gray-bg: #eef0f4;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--accent); color: #fff; padding: 22px 24px; }
  header h1 { margin: 0; font-size: 1.5rem; }
  header p { margin: 4px 0 0; opacity: 0.85; font-size: 0.95rem; }
  main { max-width: 1040px; margin: 24px auto; padding: 0 16px 40px;
         display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; align-items: start; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--border);
          border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .card:last-child { margin-bottom: 0; }
  h2 { margin: 0 0 14px; font-size: 1.05rem; }
  .summary { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .pill { padding: 4px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; white-space: nowrap; }
  .satisfied { background: var(--green-bg); color: var(--green); }
  .in_progress { background: var(--amber-bg); color: var(--amber); }
  .not_started, .unknown_type { background: var(--gray-bg); color: var(--gray); }
  .bar { height: 10px; background: var(--gray-bg); border-radius: 999px; overflow: hidden;
         margin-bottom: 16px; display: flex; }
  .seg-done { background: #16a34a; }
  .seg-prog { background: #f59e0b; }
  .req { display: flex; justify-content: space-between; align-items: center;
         padding: 10px 0; border-top: 1px solid var(--border); gap: 12px; }
  .req:first-child { border-top: none; }
  .req-name { font-weight: 600; font-size: 0.95rem; }
  .req-type { color: var(--muted); font-size: 0.78rem; margin-top: 2px; }
  label { display: block; font-size: 0.8rem; color: var(--muted); margin: 10px 0 4px; }
  input, select { width: 100%; padding: 9px 10px; border: 1px solid var(--border);
                  border-radius: 8px; font-size: 0.95rem; background: #fff; color: var(--text); }
  button { cursor: pointer; border: none; border-radius: 8px; padding: 10px 14px;
           font-size: 0.95rem; font-weight: 600; }
  .primary { background: var(--accent); color: #fff; width: 100%; margin-top: 14px; }
  .primary:hover { filter: brightness(1.1); }
  .del { background: transparent; color: var(--muted); padding: 4px 8px; font-size: 1rem; }
  .del:hover { color: #b91c1c; }
  .msg { margin-top: 10px; font-size: 0.85rem; min-height: 1.2em; }
  .msg.err { color: #b91c1c; }
  .msg.ok { color: var(--green); }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th { text-align: left; color: var(--muted); font-weight: 600; font-size: 0.75rem; padding-bottom: 6px; }
  td { padding: 7px 0; border-top: 1px solid var(--border); }
  details summary { cursor: pointer; font-weight: 600; font-size: 0.95rem; }
  .empty { color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>
<header>
  <h1>Academic Hub</h1>
  <p>Degree audit for <span id="major-name">CS_BS</span></p>
</header>

<main>
  <section>
    <div class="card">
      <h2>Degree progress</h2>
      <div class="summary" id="summary"></div>
      <div class="bar" id="bar"></div>
      <div id="audit-list"><p class="empty">Loading...</p></div>
    </div>
  </section>

  <aside>
    <div class="card">
      <h2>Log a course</h2>
      <form id="course-form">
        <label for="code">Course code</label>
        <input id="code" placeholder="CIS 2168" required>
        <label for="grade">Grade (optional)</label>
        <input id="grade" placeholder="A-">
        <label for="semester">Semester (optional)</label>
        <input id="semester" placeholder="Fall 2026">
        <label for="credits">Credits (needed for electives)</label>
        <input id="credits" type="number" min="1" max="12" placeholder="3">
        <label for="status">Status</label>
        <select id="status">
          <option value="completed">Completed</option>
          <option value="in_progress">In progress</option>
        </select>
        <button class="primary" type="submit">Add course</button>
        <div class="msg" id="course-msg"></div>
      </form>
    </div>

    <div class="card">
      <h2>My courses</h2>
      <div id="course-table"></div>
    </div>
  </aside>
</main>

<script>
  const STATUS_LABEL = { satisfied: "Satisfied", in_progress: "In progress", not_started: "Not started", unknown_type: "Unknown" };
  const TYPE_LABEL = { fixed: "Required course", either_or: "Choose one", credit_pool: "Elective credits", sequence: "Lab science sequence" };

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function normalizeCode(raw) {
    return raw.trim().toUpperCase().replace(/\s+/g, " ").replace(/^([A-Z]+)(\d)/, "$1 $2");
  }

  function setMsg(id, text, ok) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = "msg " + (ok ? "ok" : "err");
  }

  async function loadAudit() {
    const list = document.getElementById("audit-list");
    try {
      const res = await fetch("/audit");
      if (!res.ok) throw new Error("Server error " + res.status);
      const data = await res.json();
      document.getElementById("major-name").textContent = data.major;
      const reqs = data.requirements;
      const total = reqs.length;
      const done = reqs.filter(function (r) { return r.status === "satisfied"; }).length;
      const prog = reqs.filter(function (r) { return r.status === "in_progress"; }).length;
      const todo = total - done - prog;
      document.getElementById("summary").innerHTML =
        '<span class="pill satisfied">' + done + ' satisfied</span>' +
        '<span class="pill in_progress">' + prog + ' in progress</span>' +
        '<span class="pill not_started">' + todo + ' not started</span>';
      document.getElementById("bar").innerHTML =
        '<div class="seg-done" style="width:' + (total ? done / total * 100 : 0) + '%"></div>' +
        '<div class="seg-prog" style="width:' + (total ? prog / total * 100 : 0) + '%"></div>';
      list.innerHTML = reqs.map(function (r) {
        return '<div class="req"><div>' +
          '<div class="req-name">' + esc(r.group_name) + '</div>' +
          '<div class="req-type">' + esc(TYPE_LABEL[r.type] || r.type) + '</div>' +
          '</div><span class="pill ' + esc(r.status) + '">' + esc(STATUS_LABEL[r.status] || r.status) + '</span></div>';
      }).join("");
    } catch (err) {
      list.innerHTML = '<p class="empty">Could not load the audit: ' + esc(err.message) + '</p>';
    }
  }

  async function loadCourses() {
    const box = document.getElementById("course-table");
    try {
      const res = await fetch("/completed_courses");
      if (!res.ok) throw new Error("Server error " + res.status);
      const rows = await res.json();
      if (!rows.length) {
        box.innerHTML = '<p class="empty">No courses logged yet.</p>';
        return;
      }
      box.innerHTML = '<table><thead><tr><th>Course</th><th>Grade</th><th>Term</th><th>Status</th><th></th></tr></thead><tbody>' +
        rows.map(function (r) {
          return '<tr><td>' + esc(r.course_code) + '</td>' +
            '<td>' + esc(r.grade || "-") + '</td>' +
            '<td>' + esc(r.semester || "-") + '</td>' +
            '<td><span class="pill ' + esc(r.status) + '">' + esc(STATUS_LABEL[r.status] || r.status) + '</span></td>' +
            '<td><button class="del" title="Remove" data-id="' + r.id + '">&times;</button></td></tr>';
        }).join("") + '</tbody></table>';
    } catch (err) {
      box.innerHTML = '<p class="empty">Could not load courses: ' + esc(err.message) + '</p>';
    }
  }

  function refresh() {
    return Promise.all([loadAudit(), loadCourses()]);
  }

  document.getElementById("course-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    const params = new URLSearchParams();
    const code = normalizeCode(document.getElementById("code").value);
    const grade = document.getElementById("grade").value.trim();
    const semester = document.getElementById("semester").value.trim();
    params.set("course_code", code);
    if (grade) params.set("grade", grade);
    if (semester) params.set("semester", semester);
    const credits = document.getElementById("credits").value.trim();
    if (credits) params.set("credits", credits);
    params.set("status", document.getElementById("status").value);
    try {
      const res = await fetch("/completed_courses?" + params.toString(), { method: "POST" });
      if (!res.ok) throw new Error("Server error " + res.status);
      setMsg("course-msg", "Added " + code, true);
      e.target.reset();
      refresh();
    } catch (err) {
      setMsg("course-msg", err.message, false);
    }
  });

  document.getElementById("course-table").addEventListener("click", async function (e) {
    const btn = e.target.closest(".del");
    if (!btn) return;
    await fetch("/completed_courses/" + btn.dataset.id, { method: "DELETE" });
    refresh();
  });

  refresh();
</script>
</body>
</html>
